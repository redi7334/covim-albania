name: Deploy në GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Ndryshohen te Settings > Secrets and variables > Actions > Variables kur blihet domain-i
      BASE_PATH: ${{ vars.BASE_PATH || '/covim-albania/' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://redi7334.github.io/covim-albania' }}
      CNAME: ${{ vars.CNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - run: node check-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
